name: Build

# 手动触发:在 GitHub 仓库页面 Actions -> Build -> Run workflow
on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (Win7+)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          # Python 3.9 是最后一个官方支持 Windows 7 的版本(3.10 起放弃),
          # 配合 PyQt5 5.15(Qt 5.15 同样是最后支持 Win7 的 Qt)可运行于 Win7 SP1+
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 pystray Pillow PyQt-Fluent-Widgets pygetwindow psutil easygui numpy

      - name: Build with PyInstaller
        run: |
          pyinstaller -w -F --icon "./bin/icon.ico" --add-data "bin:bin" --contents-directory . --collect-all qfluentwidgets --hidden-import pystray._win32 main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Random-roll-call-windows
          path: dist/main.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller PyQt5 pystray Pillow PyQt-Fluent-Widgets pygetwindow psutil easygui numpy

      - name: Build with PyInstaller
        run: |
          # macOS 上 PyInstaller 的 --icon 需要 .icns(仓库只有 .ico),故不指定图标
          pyinstaller -w -F --add-data "bin:bin" --contents-directory . --collect-all qfluentwidgets --hidden-import pystray._darwin main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Random-roll-call-macos
          path: dist/main
